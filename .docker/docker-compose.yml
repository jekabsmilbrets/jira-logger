services:
  assets-init:
    container_name: "jira-logger-assets-init"
    build:
      context: ./../
      dockerfile: ./.docker/assets-init/Dockerfile
    environment:
      - API_HOST=${API_HOST:-https://jira-logger.io}
      - API_BASE=${API_BASE:-/api}
    volumes:
      - assetsData:/assets:rw
    restart: "no"
    labels:
      - "traefik.enable=false"

  db:
    container_name: "jira-logger-db"
    image: postgres:${POSTGRES_VERSION}-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      TZ: 'UTC'
      PGTZ: 'UTC'
    volumes:
      - dbData:/var/lib/postgresql/data:rw
      - ./postgresql/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - log_destination=stderr
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 10s
    labels:
      - "traefik.enable=false"

  nginx:
    container_name: "jira-logger-nginx"
    build:
      context: ./../
      dockerfile: ./.docker/nginx/Dockerfile
    depends_on:
      assets-init:
        condition: service_completed_successfully
    volumes:
      - assetsData:/var/www/public/ng:ro
    healthcheck:
      test: ["CMD-SHELL", "nginx -t"]
      interval: 60s
      timeout: 5s
      retries: 10
      start_period: 10s
volumes:
  dbData:
  assetsData:
