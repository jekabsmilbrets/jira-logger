services:
  node:
    container_name: "jira-logger-node"
    build:
      context: ./../
      dockerfile: ./.docker/node/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      APP_INTERNAL_TIMEZONE: ${APP_INTERNAL_TIMEZONE:-UTC}
      APP_DEFAULT_USER_TIMEZONE: ${APP_DEFAULT_USER_TIMEZONE:-Europe/Riga}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:?CORS_ALLOW_ORIGIN is required}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - assetsData:/var/www/public/ng:ro
    stop_grace_period: 135s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/internal/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    labels:
      - "traefik.enable=false"
  nginx:
    build:
      dockerfile: ./.docker/nginx/Dockerfile.node
    depends_on:
      node:
        condition: service_healthy
    volumes:
      - ./nginx/node-sites/:/etc/nginx/sites-available:ro
      - ./nginx/node-upstream/:/etc/nginx/conf.d:ro
