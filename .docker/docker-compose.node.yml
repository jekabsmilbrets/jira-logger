services:
  node:
    container_name: "jira-logger-node"
    build:
      context: ./../
      dockerfile: ./.docker/node/Dockerfile
    environment:
      SQLITE_PATH: /data/jira-logger.sqlite
      ASSETS_PATH: /app/public/ng
      APP_INTERNAL_TIMEZONE: ${APP_INTERNAL_TIMEZONE:-UTC}
      APP_DEFAULT_USER_TIMEZONE: ${APP_DEFAULT_USER_TIMEZONE:-Europe/Riga}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:?CORS_ALLOW_ORIGIN is required}
    volumes:
      - sqliteData:/data:rw
    stop_grace_period: 135s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/internal/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    labels:
      - "traefik.enable=false"
