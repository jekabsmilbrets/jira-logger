@if (!isSmallerThanDesktop()) {
    <report-settings-controls (settingsIntent)="onSettingsIntent($event)"
                              [hideWeekendsWhenDateMode]="true"
                              [state]="state()"/>
} @else {
    <ng-template [ngTemplateOutlet]="smallScreen"/>
}

<ng-template #smallScreen>
    <button (click)="onSmallScreenMenuToggle()"
            mat-icon-button
            type="button">
        <mat-icon>list</mat-icon>
    </button>
</ng-template>


<ng-template #smallScreenDialog>
    <div class="report-menu-dialog">
        <report-settings-controls (settingsIntent)="onSettingsIntent($event)"
                                  [hideWeekendsWhenDateMode]="true"
                                  [state]="state()"/>
    </div>
</ng-template>
