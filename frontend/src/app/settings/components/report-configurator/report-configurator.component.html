<mat-card>
    <mat-card-header>
        <mat-card-title>Report</mat-card-title>
    </mat-card-header>

    @if (reportSettings()) {
        <mat-card-content>
            <report-settings-controls (settingsIntent)="reportSettingsChange.emit($event)"
                                      [disabled]="disabled()"
                                      [state]="reportSettings()"/>
        </mat-card-content>
    }
</mat-card>
